# ==============================================================================
# Lake Bloom Severity Prediction - Project Configuration (Single Source of Truth)
# ==============================================================================

paths:
  raw_data: "data/raw/caml_weather_sat.csv"
  processed_data: "data/processed/clean_data.csv"
  model_dir: "outputs/models"
  model_path: "outputs/models/xgb_model.pkl"
  reports_dir: "outputs/reports"
  best_params_path: "configs/best_params.yaml"

data:
  target_col: "severity4"
  group_col: "location_group"
  forbidden_cols:
    - "severity"
    - "abundance"
    - "severity4"
    - "location_group"
  categorical_cols:
    - "data_provider"
    - "region"
  numeric_cols:
    - "distance_to_water_m"
    - "tmax_c"
    - "tmin_c"
    - "prcp_mm"
    - "wind_ms"
    - "rain_sum_7d_mm"
    - "tmax_mean_7d_c"
    - "n_water_px"
    - "B02"
    - "B03"
    - "B04"
    - "B05"
    - "B08"
    - "NDCI"
    - "NDVI"
    - "NDWI"
    - "s2_days_offset"
    - "s2_cloud_pct"
    - "year"
    - "month"

split:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

model:
  name: "XGBClassifier"
  objective: "multi:softprob"
  eval_metric: "mlogloss"
  num_class: 4
  random_state: 42
  n_jobs: -1
  base_params:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 2
    gamma: 0.1

tuning:
  scoring: "f1_macro"
  n_iter: 15
  random_state: 42
  param_distributions:
    classifier__n_estimators: [100, 150, 200]
    classifier__max_depth: [4, 6, 8]
    classifier__learning_rate: [0.03, 0.05, 0.1]
    classifier__subsample: [0.7, 0.8, 0.9]
    classifier__colsample_bytree: [0.7, 0.8, 0.9]
    classifier__min_child_weight: [1, 2, 4]
