# ==============================================================================
# Evaluation Configuration for evaluate.py
# ==============================================================================

metrics:
  primary: "macro_f1"
  all:
    - "accuracy"
    - "balanced_accuracy"
    - "macro_f1"
    - "weighted_f1"
  per_class:
    - "precision"
    - "recall"
    - "f1_score"
    - "support"

reports:
  metrics_json: "outputs/reports/metrics.json"
  summary_text: "outputs/reports/model_evaluation_report.txt"
  ablation_json: "outputs/reports/ablation_results.json"

plots:
  confusion_matrix: "outputs/reports/confusion_matrix.png"
  normalized_confusion_matrix: "outputs/reports/normalized_confusion_matrix.png"
  feature_importance: "outputs/reports/feature_importance.png"
  per_class_metrics: "outputs/reports/per_class_metrics.png"
  feature_importance_without_data_provider: "outputs/reports/feature_importance_without_data_provider.png"

comparisons:
  dummy_baseline:
    enabled: true
    strategy: "most_frequent"
  ablation_without_data_provider:
    enabled: true
    feature_to_remove: "data_provider"
